name: Presubmit

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.92.0"
  CROSS_REV: "846d469b1f08d49429d4ca834ee5a60f5d055e19"

jobs:
  fmt-lint:
    name: Format & Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "clippy,rustfmt"
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  cli-tests:
    name: CLI tests
    needs: bootstrap-installer
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        run: cargo test --workspace

  bootstrap-installer:
    name: Build installers for release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            cargo: cross
          - os: macos-15
            cargo: cargo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.os == 'macos-15' && 'x86_64-apple-darwin' || null }}
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev $CROSS_REV --locked
        if: ${{ matrix.cargo == 'cross' }}
      - name: Run release bootstrap script
        run: ./scripts/bootstrap-release.sh
      - name: Upload bootstrap installers
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-installers-${{ matrix.os }}
          path: conda-dist/installers
          if-no-files-found: error

  build-release:
    name: Build conda-dist
    needs: bootstrap-installer
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cargo: cross
            target: x86_64-unknown-linux-musl
            platform: linux-64
          - os: ubuntu-latest
            cargo: cross
            target: aarch64-unknown-linux-musl
            platform: linux-aarch64
          - os: macos-latest
            cargo: cargo
            target: x86_64-apple-darwin
            platform: osx-64
          - os: macos-latest
            cargo: cargo
            target: aarch64-apple-darwin
            platform: osx-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev $CROSS_REV --locked
        if: ${{ matrix.cargo == 'cross' }}
      - name: Download bootstrapped installers
        uses: actions/download-artifact@v5
        with:
          pattern: bootstrap-installers-*
          path: conda-dist/installers
          merge-multiple: true
      - name: Build conda-dist
        run: ${{ matrix.cargo }} build --bin conda-dist --release --locked --target ${{ matrix.target }}
      - name: Upload conda-dist
        uses: actions/upload-artifact@v4
        with:
          name: conda-dist-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/conda-dist
          if-no-files-found: error

  build-installers:
    name: Build example application installers
    needs: build-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-15
            platform: osx-arm64
          - os: macos-15-intel
            platform: osx-64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Download conda-dist
        uses: actions/download-artifact@v5
        with:
          name: conda-dist-${{ matrix.platform }}
          path: release
      - name: Build example installers
        run: |
          chmod +x release/conda-dist
          release/conda-dist installer examples/tar.toml --output-dir installers
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-built-on-${{ matrix.platform }}
          path: installers
          if-no-files-found: error

  build-container-images:
    name: Build example container images
    needs: build-release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: docker
          - runtime: podman
            container:
              image: quay.io/podman/stable:v5.6.2
              options: --privileged
    container: ${{ matrix.container || null }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Download conda-dist
        uses: actions/download-artifact@v5
        with:
          name: conda-dist-linux-64
          path: release
      - name: Make conda-dist executable
        run: chmod +x release/conda-dist
      - name: Set up QEMU for docker
        if: ${{ matrix.runtime == 'docker' }}
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: ${{ matrix.runtime == 'docker' }}
        uses: docker/setup-buildx-action@v3
      - name: Build container image
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          ENGINE=$(command -v "$RUNTIME")
          release/conda-dist container examples/tar.toml --engine "$ENGINE"
      - name: Upload container image
        uses: actions/upload-artifact@v4
        with:
          name: container-${{ matrix.runtime }}
          path: examples/portable-tar*-container.oci.tar
          if-no-files-found: error

  build-native-packages:
    name: Build example native packages
    needs: build-release
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - os: ubuntu-24.04
            platform: linux-64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Download conda-dist
        uses: actions/download-artifact@v5
        with:
          name: conda-dist-${{ matrix.platform.platform }}
          path: release
      - name: Make conda-dist executable
        run: chmod +x release/conda-dist
      - name: Build native packages
        run: |
          release/conda-dist package examples/tar.toml \
            --output-dir native-packages
      - name: Upload native packages
        uses: actions/upload-artifact@v4
        with:
          name: native-packages-${{ matrix.platform.platform }}
          path: native-packages
          if-no-files-found: error

  test-installers:
    name: Test example application installers
    needs: build-installers
    runs-on: ${{ matrix.host.os }}
    strategy:
      matrix:
        host:
          - os: ubuntu-24.04
            platform: linux-64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-15
            platform: osx-arm64
          - os: macos-15-intel
            platform: osx-64
        from:
          - linux-64
          - linux-aarch64
          - osx-arm64
          - osx-64
    steps:
      - name: Download installers
        uses: actions/download-artifact@v5
        with:
          name: installers-built-on-${{ matrix.from }}
      - name: Test installer components and subsets
        run: |
          chmod +x portable-tar*-${{ matrix.host.platform }}
          printf 'portable archive\n' > payload
          ./portable-tar-${{ matrix.host.platform }} gzip --components gzip
          PATH="$PWD/gzip/bin" gzip/bin/tar --gzip -cf archive.tar.gz payload
          test "$(PATH="$PWD/gzip/bin" gzip/bin/tar -xOf archive.tar.gz payload)" = 'portable archive'
          test ! -e gzip/bin/zstd
          ./portable-tar-compressed-${{ matrix.host.platform }} subset
          export PATH="$PWD/subset/bin"
          for scheme in gzip zstd; do
            tar --"$scheme" -cf archive.tar.$scheme payload
            test "$(tar -xOf archive.tar.$scheme payload)" = 'portable archive'
          done

  test-native-packages:
    name: Test example native packages
    needs: build-native-packages
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - container: redhat/ubi10
            package_subdir: redhat
            manager: dnf
            replace_flags: --allowerasing
          - container: ubuntu:24.04
            package_subdir: ubuntu
            manager: apt
        platform:
          - os: ubuntu-24.04
            platform: linux-64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
    container: ${{ matrix.image.container }}
    steps:
      - name: Download native packages
        uses: actions/download-artifact@v5
        with:
          name: native-packages-${{ matrix.platform.platform }}
          path: native-packages
      - name: Test native package components and subsets
        shell: bash
        run: |
          BUNDLE="$GITHUB_WORKSPACE/native-packages/bundle/${{ matrix.image.package_subdir }}"
          MODULAR="$GITHUB_WORKSPACE/native-packages/modular/${{ matrix.image.package_subdir }}"
          printf 'portable archive\n' > payload
          if ${{ matrix.image.manager }} install -y "$BUNDLE"/portable-tar[-_][0-9]* "$BUNDLE"/portable-tar-compressed*; then exit 1; fi
          ${{ matrix.image.manager }} install -y "$BUNDLE"/portable-tar[-_][0-9]*
          /opt/portable-tar/bin/tar --version
          test ! -e /opt/portable-tar/bin/gzip
          test ! -e /opt/portable-tar/bin/zstd
          ${{ matrix.image.manager }} install -y ${{ matrix.image.replace_flags }} "$BUNDLE"/portable-tar-compressed*
          PATH=/opt/portable-tar/bin /opt/portable-tar/bin/tar --gzip -cf archive.tar.gz payload
          test "$(PATH=/opt/portable-tar/bin /opt/portable-tar/bin/tar -xOf archive.tar.gz payload)" = 'portable archive'
          ${{ matrix.image.manager }} remove -y portable-tar-compressed
          if ${{ matrix.image.manager }} install -y "$MODULAR"/portable-tar[-_][0-9]* "$MODULAR"/portable-tar-conda-* "$BUNDLE"/portable-tar-compressed*; then exit 1; fi
          ${{ matrix.image.manager }} install -y "$MODULAR"/*
          PATH=/opt/portable-tar/bin /opt/portable-tar/bin/tar --zstd -cf archive.tar.zst payload
          test "$(PATH=/opt/portable-tar/bin /opt/portable-tar/bin/tar -xOf archive.tar.zst payload)" = 'portable archive'

  test-container-images:
    name: Test example container images
    needs: build-container-images
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
        host:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
        source: [docker, podman]
        include:
          - runtime: docker
            storage: docker-daemon
          - runtime: podman
            storage: containers-storage
            container:
              image: quay.io/podman/stable:v5.6.2
              options: --privileged
    runs-on: ${{ matrix.host.os }}
    container: ${{ matrix.container || null }}
    steps:
      - name: Install Docker prerequisites
        if: ${{ matrix.runtime == 'docker' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - name: Install Podman prerequisites
        if: ${{ matrix.runtime == 'podman' }}
        run: dnf -y install skopeo
      - name: Download container image
        uses: actions/download-artifact@v5
        with:
          name: container-${{ matrix.source }}
          path: containers
      - name: Test base and subset images
        shell: bash
        run: |
          for NAME in portable-tar portable-tar-compressed; do
            IMAGE=docker.io/library/$NAME:1.0.0
            skopeo copy oci-archive:containers/$NAME-container.oci.tar ${{ matrix.storage }}:$IMAGE
            ${{ matrix.runtime }} run --rm --env PATH=/opt/portable-tar/bin "$IMAGE" /bin/sh -ec '
              printf "portable archive\n" > payload
              tar -cf archive.tar payload
              test "$(tar -xOf archive.tar payload)" = "portable archive"
              if [ "$1" = portable-tar-compressed ]; then
                for OPTION in --gzip --zstd; do
                  tar "$OPTION" -cf archive.tar payload
                  test "$(tar -xOf archive.tar payload)" = "portable archive"
                done
              fi
            ' sh "$NAME"
          done
